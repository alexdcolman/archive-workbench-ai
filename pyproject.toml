[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archive-workbench-ai"
version = "0.1.0.dev20"
description = "External assisted-analysis engine for Archive Workbench"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Archive Workbench project"}]
dependencies = ["Pillow>=10"]

[project.scripts]
aw-ai = "archive_workbench_ai.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
archive_workbench_ai = ["schemas/*.json", "prompts/*.txt"]
