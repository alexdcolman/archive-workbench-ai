name: Build Archive Workbench AI native candidates

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Candidata nativa a construir"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - linux-x64
          - windows-x64
          - macos

permissions:
  contents: read

jobs:
  linux-x64:
    if: ${{ inputs.target == 'all' || inputs.target == 'linux-x64' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build standalone binary
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel pyinstaller
          python -m pip install .
          python -m PyInstaller --clean --onefile --name aw-ai \
            --collect-data archive_workbench_ai packaging/aw_ai_entry.py
          ./dist/aw-ai --version
          ./dist/aw-ai setup --status-json > native-linux-status.json
          ./dist/aw-ai bridge start --json > native-linux-bridge-start.json
          ./dist/aw-ai bridge status --json > native-linux-bridge-status.json
          ./dist/aw-ai bridge stop --json > native-linux-bridge-stop.json
          python scripts/make_demo_job.py --output native-linux-smoke
          ./dist/aw-ai analyze \
            --input native-linux-smoke/exp01.zip \
            --output native-linux-smoke/handoff.zip \
            --result-output native-linux-smoke/result.zip \
            --profile H24 --backend mock > native-linux-analyze.json
          test -s native-linux-smoke/handoff.zip
          test -s native-linux-smoke/result.zip
          python scripts/native_bridge_daemon_smoke.py \
            --binary dist/aw-ai \
            --input native-linux-smoke/exp01.zip \
            --root native-linux-daemon-bridge \
            --output native-linux-daemon-smoke.json
          VERSION=$(python -c 'import archive_workbench_ai; print(archive_workbench_ai.__version__)')
          python packaging/linux/build_deb.py --binary dist/aw-ai --version "$VERSION" --output-dir native-dist
          sha256sum native-dist/*.deb > native-dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: archive-workbench-ai-linux-x64
          path: |
            native-dist/*.deb
            native-dist/SHA256SUMS.txt
            native-linux-*.json
            native-linux-smoke/*.zip

  windows-x64:
    if: ${{ inputs.target == 'all' || inputs.target == 'windows-x64' }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build standalone binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip setuptools wheel pyinstaller
          python -m pip install .
          python -m PyInstaller --clean --onefile --name aw-ai --collect-data archive_workbench_ai packaging/aw_ai_entry.py
          .\dist\aw-ai.exe --version
          .\dist\aw-ai.exe setup --status-json | Out-File -Encoding utf8 native-windows-status.json
          .\dist\aw-ai.exe bridge start --json | Out-File -Encoding utf8 native-windows-bridge-start.json
          .\dist\aw-ai.exe bridge status --json | Out-File -Encoding utf8 native-windows-bridge-status.json
          .\dist\aw-ai.exe bridge stop --json | Out-File -Encoding utf8 native-windows-bridge-stop.json
          python scripts\make_demo_job.py --output native-windows-smoke
          .\dist\aw-ai.exe analyze --input native-windows-smoke\exp01.zip --output native-windows-smoke\handoff.zip --result-output native-windows-smoke\result.zip --profile H24 --backend mock | Out-File -Encoding utf8 native-windows-analyze.json
          if (-not (Test-Path native-windows-smoke\handoff.zip)) { throw "Native analyze smoke did not create handoff.zip" }
          if (-not (Test-Path native-windows-smoke\result.zip)) { throw "Native analyze smoke did not create result.zip" }
          python scripts\native_bridge_daemon_smoke.py --binary dist\aw-ai.exe --input native-windows-smoke\exp01.zip --root native-windows-daemon-bridge --output native-windows-daemon-smoke.json
          choco install innosetup --no-progress -y
          $env:AWAI_VERSION = (python -c "import archive_workbench_ai; print(archive_workbench_ai.__version__)")
          $env:AWAI_BINARY = (Resolve-Path .\dist\aw-ai.exe).Path
          New-Item -ItemType Directory -Force native-dist | Out-Null
          $env:AWAI_OUTPUT_DIR = (Resolve-Path .\native-dist).Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\ArchiveWorkbenchAI.iss
          Get-ChildItem native-dist\*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii native-dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: archive-workbench-ai-windows-x64
          path: |
            native-dist/*.exe
            native-dist/SHA256SUMS.txt
            native-windows-*.json
            native-windows-smoke/*.zip

  macos:
    if: ${{ inputs.target == 'all' || inputs.target == 'macos' }}
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            artifact: archive-workbench-ai-macos-intel
          - runner: macos-15
            artifact: archive-workbench-ai-macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build app and DMG
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel pyinstaller
          python -m pip install .
          python -m PyInstaller --clean --onefile --name aw-ai \
            --collect-data archive_workbench_ai packaging/aw_ai_entry.py
          ./dist/aw-ai --version
          ./dist/aw-ai setup --status-json > native-macos-status.json
          ./dist/aw-ai bridge start --json > native-macos-bridge-start.json
          ./dist/aw-ai bridge status --json > native-macos-bridge-status.json
          ./dist/aw-ai bridge stop --json > native-macos-bridge-stop.json
          python scripts/make_demo_job.py --output native-macos-smoke
          ./dist/aw-ai analyze \
            --input native-macos-smoke/exp01.zip \
            --output native-macos-smoke/handoff.zip \
            --result-output native-macos-smoke/result.zip \
            --profile H24 --backend mock > native-macos-analyze.json
          test -s native-macos-smoke/handoff.zip
          test -s native-macos-smoke/result.zip
          python scripts/native_bridge_daemon_smoke.py \
            --binary dist/aw-ai \
            --input native-macos-smoke/exp01.zip \
            --root native-macos-daemon-bridge \
            --output native-macos-daemon-smoke.json
          VERSION=$(python -c 'import archive_workbench_ai; print(archive_workbench_ai.__version__)')
          mkdir -p native-dist
          packaging/macos/build_app.sh dist/aw-ai "$VERSION" native-dist
          shasum -a 256 native-dist/*.dmg > native-dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            native-dist/*.dmg
            native-dist/SHA256SUMS.txt
            native-macos-*.json
            native-macos-smoke/*.zip
