name: Build pinned Linux NVIDIA runtime candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space for CUDA candidate build
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          docker system prune -af || true
          df -h /
      - name: Build llama.cpp b10903 CUDA runtime without host CUDA toolkit
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p runtime-dist
          docker run --rm \
            -v "$PWD/runtime-dist:/out" \
            nvidia/cuda:12.8.1-devel-ubuntu24.04 \
            bash -lc '
              set -euxo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git cmake build-essential binutils ca-certificates
              git clone https://github.com/ggml-org/llama.cpp.git /src
              git -C /src checkout --detach 481c65f091f74c5e7089dd0a3a1cc6b50cced31e
              test "$(git -C /src rev-parse HEAD)" = "481c65f091f74c5e7089dd0a3a1cc6b50cced31e"
              cmake -S /src -B /build \
                -DGGML_CUDA=ON \
                -DGGML_CUDA_NCCL=OFF \
                -DGGML_NATIVE=OFF \
                -DGGML_CUDA_FA_QUANTS="q4_0-q4_0;q8_0-q8_0;f16-f16;bf16-bf16" \
                -DCMAKE_EXE_LINKER_FLAGS=-Wl,--allow-shlib-undefined
              cmake --build /build --config Release --target llama-server -j"$(nproc)"

              mkdir -p /stage/bin /stage/lib
              cp /build/bin/llama-server /stage/bin/llama-server-bin
              find /build/bin -maxdepth 1 \( -type f -o -type l \) -name "*.so*" -exec cp -a {} /stage/lib/ \;

              CUDA_LIB_ROOT=/usr/local/cuda/targets/x86_64-linux/lib
              test -d "$CUDA_LIB_ROOT"
              for pattern in "libcudart.so*" "libcublas.so*" "libcublasLt.so*" "libnvJitLink.so*"; do
                copied=0
                for f in "$CUDA_LIB_ROOT"/$pattern; do
                  [ -e "$f" ] || continue
                  cp -a "$f" /stage/lib/
                  copied=1
                done
                test "$copied" -eq 1
              done

              CUDA_BACKEND=""
              for candidate in /stage/lib/libggml-cuda.so*; do
                if [ -f "$candidate" ]; then
                  CUDA_BACKEND="$candidate"
                  break
                fi
              done
              test -n "$CUDA_BACKEND"

              DYNAMIC_SECTION="$(readelf -d "$CUDA_BACKEND")"
              case "$DYNAMIC_SECTION" in
                *"Shared library: [libcuda.so.1]"*) ;;
                *)
                  printf "%s\n" "$DYNAMIC_SECTION"
                  echo "libggml-cuda no conserva dependencia al driver libcuda.so.1" >&2
                  exit 1
                  ;;
              esac

              if compgen -G "/stage/lib/libcuda.so*" > /dev/null; then
                echo "El staging contiene libcuda.so; el driver del host no debe empaquetarse." >&2
                exit 1
              fi

              if printf "%s\n" "$DYNAMIC_SECTION" | grep -F "libnccl.so"; then
                echo "libggml-cuda conserva una dependencia NCCL no permitida para el runtime administrado." >&2
                exit 1
              fi
              if compgen -G "/stage/lib/libnccl.so*" > /dev/null; then
                echo "El staging contiene NCCL; este runtime debe ser autocontenido sin NCCL." >&2
                exit 1
              fi

              STUB_DIR="$CUDA_LIB_ROOT/stubs"
              test -f "$STUB_DIR/libcuda.so"
              mkdir -p /tmp/driver-stub
              ln -sf "$STUB_DIR/libcuda.so" /tmp/driver-stub/libcuda.so.1
              LDD_OUTPUT="$(LD_LIBRARY_PATH="/tmp/driver-stub:/stage/lib" ldd /stage/bin/llama-server-bin)"
              printf "%s\n" "$LDD_OUTPUT"
              case "$LDD_OUTPUT" in
                *"not found"*)
                  echo "Quedaron dependencias compartidas sin resolver en el runtime candidato." >&2
                  exit 1
                  ;;
              esac

              cat > /stage/llama-server <<"EOF_WRAPPER"
          #!/bin/sh
          HERE=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          export LD_LIBRARY_PATH="$HERE/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$HERE/bin/llama-server-bin" "$@"
          EOF_WRAPPER
              chmod +x /stage/llama-server /stage/bin/llama-server-bin

              tar -C /stage -czf /out/llama-b10903-bin-ubuntu-cuda-12.8-x64.tar.gz .
              tar -tzf /out/llama-b10903-bin-ubuntu-cuda-12.8-x64.tar.gz > /tmp/runtime-files.txt
              if grep -E "(^|/)libcuda\.so" /tmp/runtime-files.txt; then
                echo "El archivo final contiene libcuda.so y es inválido." >&2
                exit 1
              fi
              sha256sum /out/llama-b10903-bin-ubuntu-cuda-12.8-x64.tar.gz > /out/SHA256SUMS.txt
            '
          test -s runtime-dist/llama-b10903-bin-ubuntu-cuda-12.8-x64.tar.gz
          cat runtime-dist/SHA256SUMS.txt
      - name: Validate candidate outside CUDA build image
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "$PWD/runtime-dist:/runtime-dist:ro" \
            ubuntu:24.04 \
            bash -lc '
              set -euxo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils ca-certificates
              mkdir -p /candidate
              tar -C /candidate -xzf /runtime-dist/llama-b10903-bin-ubuntu-cuda-12.8-x64.tar.gz
              if find /candidate -type f -o -type l | grep -E "/libnccl\.so"; then
                echo "El runtime candidato empaqueta NCCL y es inválido." >&2
                exit 1
              fi
              CUDA_BACKEND=""
              for candidate in /candidate/lib/libggml-cuda.so*; do
                if [ -f "$candidate" ]; then CUDA_BACKEND="$candidate"; break; fi
              done
              test -n "$CUDA_BACKEND"
              DYNAMIC_SECTION="$(readelf -d "$CUDA_BACKEND")"
              if printf "%s\n" "$DYNAMIC_SECTION" | grep -F "libnccl.so"; then
                echo "El runtime candidato conserva una dependencia a NCCL." >&2
                exit 1
              fi
              LDD_OUTPUT="$(LD_LIBRARY_PATH=/candidate/lib ldd /candidate/bin/llama-server-bin || true)"
              printf "%s\n" "$LDD_OUTPUT"
              MISSING="$(printf "%s\n" "$LDD_OUTPUT" | grep "not found" || true)"
              if [ -n "$MISSING" ]; then
                UNEXPECTED="$(printf "%s\n" "$MISSING" | grep -v "libcuda.so.1 => not found" || true)"
                if [ -n "$UNEXPECTED" ]; then
                  printf "%s\n" "$UNEXPECTED" >&2
                  echo "El runtime candidato tiene dependencias no resueltas fuera del contenedor CUDA." >&2
                  exit 1
                fi
              fi
            '
      - uses: actions/upload-artifact@v4
        with:
          name: llama-b10903-linux-nvidia-x64-candidate
          path: runtime-dist/*
